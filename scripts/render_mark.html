<!doctype html>
<!--
  Render harness for the casegate 3D mark (docs/DESIGN.md §3). The docs/design/options/build.py
  scene with no rAF loop and no pointer input. scripts/render_mark.py drives it with Playwright.
  Query params: ?size=N (canvas CSS px, default 512) &bg=transparent|RRGGBB (no '#').
  Exposes window.glOk (boolean, set once the scene is ready; undefined while loading) and
  window.renderAt(t, palette, sway), which renders one frame synchronously.
-->
<html lang="en"><head><meta charset="utf-8"><title>casegate mark render</title>
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
const q = new URLSearchParams(location.search);
const SIZE = parseInt(q.get('size') || '512', 10);
const BG = q.get('bg') || 'transparent';
if (BG !== 'transparent') document.documentElement.style.background = document.body.style.background = '#' + BG;

// Palettes (DESIGN §3). Light fail = the light banner's fail tick colour (DESIGN §7).
const PALETTES = {
  dark: { body: '#E3ECE7', pass: '#3DDC84', fail: '#FF5D5D' },
  light: { body: '#0B0F0E', pass: '#1A8F4E', fail: '#C8312F' },
};

let THREE = null;
try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'); } catch (e) { THREE = null; }
const c = document.createElement('canvas');
const gl = THREE && (c.getContext('webgl2', { alpha: true, antialias: true, preserveDrawingBuffer: true })
  || c.getContext('webgl', { alpha: true, antialias: true, preserveDrawingBuffer: true }));

if (THREE && gl) {
  document.body.appendChild(c);
  const r = new THREE.WebGLRenderer({ canvas: c, context: gl, antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1);
  r.setClearColor(0x000000, 0);
  r.setSize(SIZE, SIZE, true);
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, .1, 100); cam.position.set(0, 0.3, 12.5);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.4));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 4, 6); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(-4, -2, -3); scene.add(rim);
  function bar(w, h) {
    const s = new THREE.Shape(); const rr = h / 2;
    s.moveTo(0, -rr); s.lineTo(w - rr, -rr); s.absarc(w - rr, 0, rr, -Math.PI / 2, Math.PI / 2, false); s.lineTo(0, rr); s.absarc(0, 0, rr, Math.PI / 2, Math.PI * 1.5, false);
    return new THREE.ExtrudeGeometry(s, { depth: .42, bevelEnabled: true, bevelThickness: .08, bevelSize: .06, bevelSegments: 6, curveSegments: 24 }).translate(0, 0, -.21);
  }
  const matPost = new THREE.MeshStandardMaterial({ color: PALETTES.dark.body, metalness: .35, roughness: .35 });
  const matArm = new THREE.MeshStandardMaterial({ color: PALETTES.dark.pass, metalness: .25, roughness: .3 });
  const g = new THREE.Group(); scene.add(g);
  const leg = new THREE.Mesh(bar(1.35, .46), matPost); leg.rotation.z = Math.PI * 3 / 4; g.add(leg);
  const pivot = new THREE.Group(); g.add(pivot);
  const arm = new THREE.Mesh(bar(3.1, .46), matArm); pivot.add(arm);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(.34, .34, .62, 40).rotateX(Math.PI / 2), matPost); g.add(hub);
  g.position.set(-.7, -.9, 0);
  const UP = Math.PI / 4.1, DOWN = -0.12;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const cyc = 5.2;
  // angleAt: the build.py function (DESIGN §4), minus its one unused local.
  function angleAt(s) {
    const p = (s % cyc) / cyc;
    if (p < .38) return { a: UP, f: false };
    if (p < .44) { const k = ease((p - .38) / .06); return { a: UP + k * .12, f: false } }            // anticipation
    if (p < .54) { const k = (p - .44) / .10; const e2 = 1 - Math.pow(1 - k, 3); return { a: UP + .12 - (UP + .12 - DOWN) * e2 - (k > .8 ? Math.sin((k - .8) * 15) * .05 : 0), f: k > .35 } } // drop, settle
    if (p < .80) return { a: DOWN, f: true };
    const k = ease((p - .80) / .20); return { a: DOWN + (UP - DOWN) * k, f: k < .5 };
  }
  window.renderAt = function (t, palette, sway) {
    const pal = PALETTES[palette];
    if (!pal) throw new Error('unknown palette: ' + palette);
    const st = angleAt(t);
    pivot.rotation.z = st.a;
    matPost.color.set(pal.body);
    matArm.color.set(st.f ? pal.fail : pal.pass);
    g.rotation.y = -0.35 + (sway ? 0.08 * Math.sin(2 * Math.PI * t / cyc) : 0);
    g.rotation.x = 0;
    r.render(scene, cam);
    return { angle: st.a, fail: st.f };
  };
  window.glOk = true;
} else {
  window.glOk = false;
}
</script>
</body></html>

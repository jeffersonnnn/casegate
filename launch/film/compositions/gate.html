  <script>
    (function () {
      const FPS = 30;
      // Regression heights (casegate-run.json) and baseline heights (baseline.json), DESIGN §8.
      const RUN = [24, 22, 44, 44, 41, 44, 44, 44, 44, 44, 44, 44, 42, 44, 44];
      const BASE = [44, 44, 44, 44, 44, 44, 44, 44, 44, 43, 44, 44, 42, 44, 44];
      const mini = document.getElementById("g-ticks"), endRow = document.getElementById("g-endticks");
      const mk = (parent, cls, k, w, gap, h, id) => {
        const el = document.createElement("i"); el.className = cls; el.id = id;
        el.style.left = k * (w + gap) + "px"; el.style.height = h + "px"; parent.appendChild(el); return el;
      };
      const reg = RUN.map((h, k) => mk(mini, "gt" + (k < 2 ? " f" : ""), k, 10, 10, h * 1.5, "g-r" + k));
      const fix = BASE.map((h, k) => mk(mini, "gt", k, 10, 10, h * 1.5, "g-x" + k));
      BASE.forEach((h, k) => mk(endRow, "et", k, 12, 11, h * 1.5, "g-e" + k));
      // Command typed letter by letter (the site's install chip text).
      const cmdText = "uv add casegate", cmd = document.getElementById("g-cmdtext");
      const chars = [...cmdText].map((c, i) => { const s = document.createElement("span"); s.className = "ch"; s.id = "g-c" + i; s.textContent = c === " " ? " " : c; cmd.appendChild(s); return s; });

      // Mark pose: scene frame -> DESIGN §4 cycle frame (launch/SPEC.md "Logo cycle at 30 fps").
      // Drop: cycle frame 82 = scene frame 64 = film frame 619. PASSED colour: cycle 141 = scene 325 = film 880.
      function cycleFrame(sf) {
        if (sf < 72) return sf + 18;      // up, anticipation, drop, settle
        if (sf < 309) return 90;          // hold blocked
        if (sf < 340) return sf - 184;    // lift back, colour to pass at cycle frame 141
        return 0;                         // up: the pass pose
      }
      const expoOut = gsap.parseEase("expo.out");
      // Secondary action on the end card: the mark turns in on Y as it lands.
      const rotYAt = (t) => (t < 18.5 ? 0 : 0.55 * (1 - expoOut(Math.min(1, (t - 18.5) / 1.1))));
      const stateEl = document.getElementById("g-state");
      const clock = { t: 0 };

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["gate-mark"] = CasegateMark.create(document.getElementById("g-canvas"), 760).then((mark) => {
        const draw = () => {
          const sf = Math.round(clock.t * FPS);
          const st = mark.render(cycleFrame(sf) / FPS, rotYAt(clock.t));
          stateEl.textContent = st.f ? "✗ blocked" : "✓ pass";
          stateEl.style.color = st.f ? "#FF5D5D" : "#3DDC84";
        };
        const tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: 26.5, duration: 26.5, ease: "none", onUpdate: draw }, 0);
        // Whip in from the right (matches the run scene's whip out to the left).
        tl.fromTo("#gate-stage", { x: 280, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 0);
        // Staging: the mark is alone, centred, for the drop (scene 2.133 s). Then it moves left on an arc
        // (x eases both ways, y rises then settles) while the comment enters: overlapping action.
        tl.set("#g-mark", { scale: 1.35, transformOrigin: "50% 50%" }, 0);
        tl.to("#g-mark", { x: -500, scale: 1, duration: 0.75, ease: "power2.inOut" }, 2.3);
        tl.to("#g-mark", { keyframes: [{ y: -90, duration: 0.38, ease: "sine.out" }, { y: -50, duration: 0.37, ease: "sine.in" }] }, 2.3);
        tl.to("#g-state", { x: -500, y: -130, duration: 0.75, ease: "power2.inOut" }, 2.36);
        tl.fromTo("#g-card", { x: 140, opacity: 0, filter: "blur(12px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 2.55);
        tl.fromTo("#g-card", { scaleY: 1 }, { keyframes: [{ scaleY: 0.97, duration: 0.06, ease: "none" }, { scaleY: 1, duration: 0.3, ease: "elastic.out(1, 0.7)" }], transformOrigin: "50% 0%" }, 2.75);
        tl.set("#g-pass", { opacity: 0 }, 0);
        tl.fromTo(reg, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.3, stagger: 0.02, ease: "power3.out" }, 2.9);
        tl.set(fix, { scaleY: 0, transformOrigin: "50% 100%" }, 0);
        // 2.4 s on the headline before the scroll: time to read BLOCKED and the delta before the flips.
        tl.fromTo("#g-hl1", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 3.3);
        tl.to("#g-block", { y: -300, duration: 0.7, ease: "power2.inOut" }, 5.7);
        tl.fromTo("#g-hl2", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 6.5);
        // Push 2 arrives, the cases run again (a tick each, 0.1 s apart from 8.6 = film 27.1).
        tl.fromTo("#g-chip", { y: 40, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 8.3);
        reg.forEach((el, k) => tl.to(el, { scaleY: 0, duration: 0.08, ease: "power3.in" }, 8.6 + k * 0.1 - 0.04));
        fix.forEach((el, k) => tl.fromTo(el, { scaleY: 0 }, { keyframes: [{ scaleY: 1.1, duration: 0.1, ease: "power3.out" }, { scaleY: 1, duration: 0.1, ease: "power2.inOut" }] }, 8.6 + k * 0.1));
        tl.to("#g-block", { y: 0, duration: 0.5, ease: "power2.inOut" }, 10.05);
        // The same comment is edited in place on scene 10.833 s (film frame 880): BLOCKED -> PASSED.
        tl.to("#g-block", { opacity: 0, filter: "blur(8px)", duration: 0.067, ease: "power2.in" }, 10.8);
        tl.fromTo("#g-pass", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.067, ease: "power2.out" }, 10.8);
        tl.fromTo("#g-card", { scale: 1 }, { keyframes: [{ scale: 1.012, duration: 0.05, ease: "power2.out" }, { scale: 1, duration: 0.3, ease: "power2.out" }], transformOrigin: "50% 50%" }, 10.833);
        tl.fromTo("#g-hl3", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 11.1);
        // Exits (faster than entrances), then the claim.
        tl.to(["#g-card"], { x: 90, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power3.in" }, 14.3);
        tl.to(["#g-chip", "#g-ticks", "#g-state", "#g-tele-l"], { y: 40, opacity: 0, duration: 0.25, stagger: 0.03, ease: "power3.in" }, 14.3);
        tl.to("#g-mark", { x: 560, y: 30, scale: 1.15, duration: 0.8, ease: "power2.inOut" }, 14.35);
        tl.fromTo("#g-h1 span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" }, 14.75);
        tl.to("#g-h1 span", { opacity: 0, filter: "blur(6px)", duration: 0.13, stagger: 0.025, ease: "power3.in" }, 18.2);
        // The wordmark wipes out of the mark after it lands, so the mark and the name read as one sign.
        tl.to("#g-mark", { x: -440, y: 45, scale: 1.15, duration: 0.85, ease: "power3.inOut" }, 18.4);
        tl.fromTo("#g-word", { clipPath: "inset(0 100% 0 0)", x: -40 }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.55, ease: "power3.out" }, 19.05);
        tl.fromTo("#g-cmd", { opacity: 0, filter: "blur(8px)", y: 20 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.35, ease: "expo.out" }, 19.5);
        chars.forEach((c, i) => tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 19.75 + i * 0.05));
        tl.fromTo("#g-endticks", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power2.out" }, 20.6);
        tl.fromTo("#g-endnote", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 20.9);
        window.__timelines["gate"] = tl;
      });
    })();
  </script>
